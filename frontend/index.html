<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenSante - Pre-diagnostic</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">

    <header class="bg-blue-600 text-white py-4 shadow-lg">
        <div class="max-w-4xl mx-auto px-4">
            <h1 class="text-2xl font-bold">SenSante</h1>
            <p class="text-blue-100 text-sm">Assistant pre-diagnostic medical</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Formulaire -->
            <div id="form-section" class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Symptômes du patient</h2>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                    <input type="number" id="age"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Ex : 28" min="0" max="120">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sexe</label>
                    <select id="sexe" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="F">Féminin</option>
                        <option value="M">Masculin</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Température (°C)</label>
                    <input type="number" id="temperature" step="0.1"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Ex : 38.5" min="35" max="42">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tension systolique</label>
                    <input type="number" id="tension_sys"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Ex : 120" min="60" max="250">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Symptômes</label>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="checkbox" id="toux" class="rounded text-blue-600 mr-2">
                            <span>Toux</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" id="fatigue" class="rounded text-blue-600 mr-2">
                            <span>Fatigue</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" id="maux_tete" class="rounded text-blue-600 mr-2">
                            <span>Maux de tête</span>
                        </label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Région</label>
                    <select id="region" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="Dakar">Dakar</option>
                        <option value="Thies">Thiès</option>
                        <option value="Saint-Louis">Saint-Louis</option>
                        <option value="Ziguinchor">Ziguinchor</option>
                        <option value="Tambacounda">Tambacounda</option>
                        <option value="Kaolack">Kaolack</option>
                        <option value="Diourbel">Diourbel</option>
                        <option value="Fatick">Fatick</option>
                        <option value="Kolda">Kolda</option>
                        <option value="Matam">Matam</option>
                    </select>
                </div>

                <button onclick="diagnostiquer()" id="btn-diag"
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-200 shadow-md">
                    Diagnostiquer
                </button>
            </div>

            <!-- Résultat -->
            <div id="result-section">
                <div class="bg-white rounded-xl shadow-md p-6 text-center text-gray-400">
                    <p class="text-4xl mb-3">🩺</p>
                    <p class="font-medium">Remplissez le formulaire</p>
                    <p class="text-sm mt-1">puis cliquez sur Diagnostiquer</p>
                </div>
            </div>

        </div>

        <div id="historique-section" class="max-w-4xl mx-auto"></div>
    </main>

    <footer class="text-center text-gray-400 text-sm py-4">
        SenSante v0.4 - ESP / UCAD - L2 GLSI 2026
    </footer>

    <script>

        const API_URL = "http://localhost:8000";
        const historique = [];

        // ─────────────────────────────────────────
        // HISTORIQUE
        // ─────────────────────────────────────────

        function mettreAJourHistorique(patient, resultat) {
            historique.unshift({
                age        : patient.age,
                diagnostic : resultat.diagnostic,
                prob       : Math.round(resultat.probabilite * 100) + "%"
            });
            if (historique.length > 5) historique.pop();
            afficherHistorique();
        }

        function afficherHistorique() {
            const section = document.getElementById("historique-section");
            if (!section || historique.length === 0) {
                if (section) section.innerHTML = "";
                return;
            }

            const icones       = { palu:"🌡️", grippe:"❄️", typh:"🤒", sain:"✅" };
            const couleursBadge = {
                palu  : "bg-red-100 text-red-700",
                grippe: "bg-orange-100 text-orange-700",
                typh  : "bg-yellow-100 text-yellow-700",
                sain  : "bg-green-100 text-green-700"
            };

            const lignes = historique.map(h => {
                const icone = icones[h.diagnostic] || "❓";
                const badge = couleursBadge[h.diagnostic] || "bg-gray-100 text-gray-700";
                return `
                    <div class="flex items-center justify-between py-2 border-b border-gray-100 last:border-0">
                        <span class="text-sm text-gray-600">${h.age} ans</span>
                        <span class="${badge} text-xs font-medium px-2 py-1 rounded-full">
                            ${icone} ${h.diagnostic}
                        </span>
                        <span class="text-sm font-bold text-gray-700">${h.prob}</span>
                    </div>`;
            }).join("");

            section.innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-6 mt-6">
                    <h2 class="text-lg font-bold text-gray-800 mb-3">🕓 Historique des diagnostics</h2>
                    ${lignes}
                </div>`;
        }

        // ─────────────────────────────────────────
        // DIAGNOSTIC PRINCIPAL
        // ─────────────────────────────────────────

        async function diagnostiquer() {

            const btn = document.getElementById("btn-diag");
            btn.disabled = true;
            btn.textContent = "Analyse...";

            const patient = {
                age         : parseInt(document.getElementById("age").value),
                sexe        : document.getElementById("sexe").value,
                temperature : parseFloat(document.getElementById("temperature").value),
                tension_sys : parseInt(document.getElementById("tension_sys").value),
                toux        : document.getElementById("toux").checked,
                fatigue     : document.getElementById("fatigue").checked,
                maux_tete   : document.getElementById("maux_tete").checked,
                region      : document.getElementById("region").value
            };

            if (isNaN(patient.age) || isNaN(patient.temperature) || isNaN(patient.tension_sys)) {
                afficherErreur("Veuillez remplir tous les champs.");
                btn.disabled = false;
                btn.textContent = "Diagnostiquer";
                return;
            }

            afficherChargement();

            try {
                const response = await fetch(API_URL + "/predict", {
                    method  : "POST",
                    headers : { "Content-Type": "application/json" },
                    body    : JSON.stringify(patient)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail ? JSON.stringify(err.detail) : "Erreur serveur");
                }

                const resultat = await response.json();
                afficherResultat(resultat);
                mettreAJourHistorique(patient, resultat);

            } catch (error) {
                afficherErreur("Erreur de connexion : " + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Diagnostiquer";
            }
        }

        // ─────────────────────────────────────────
        // AFFICHAGE — CHARGEMENT
        // ─────────────────────────────────────────

        function afficherChargement() {
            document.getElementById("result-section").innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-6 text-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                    <p class="text-gray-500">Analyse en cours...</p>
                </div>`;
        }

        // ─────────────────────────────────────────
        // AFFICHAGE — RÉSULTAT (Lab 4 + appel Lab 5)
        // ─────────────────────────────────────────

        function afficherResultat(r) {

            const couleurs = {
                palu  : { bg:"bg-red-100",    text:"text-red-800",    bar:"bg-red-500",    badge:"bg-red-500",    icone:"🌡️" },
                grippe: { bg:"bg-orange-100", text:"text-orange-800", bar:"bg-orange-500", badge:"bg-orange-500", icone:"❄️" },
                typh  : { bg:"bg-yellow-100", text:"text-yellow-800", bar:"bg-yellow-500", badge:"bg-yellow-500", icone:"🤒" },
                sain  : { bg:"bg-green-100",  text:"text-green-800",  bar:"bg-green-500",  badge:"bg-green-500",  icone:"✅" }
            };

            const c   = couleurs[r.diagnostic] || couleurs["sain"];
            const pct = Math.round(r.probabilite * 100);

            // Échappement XSS sur les champs texte de l'API
            const escape = s => String(s)
                .replace(/&/g,"&amp;")
                .replace(/</g,"&lt;")
                .replace(/>/g,"&gt;");

            document.getElementById("result-section").innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-6">

                    <h2 class="text-xl font-bold text-gray-800 mb-4">Résultat</h2>

                    <div class="${c.bg} rounded-lg p-4 mb-4">
                        <p class="text-sm text-gray-600">Diagnostic :</p>
                        <p class="text-2xl font-bold ${c.text} uppercase mt-1">
                            ${c.icone} ${escape(r.diagnostic)}
                        </p>
                    </div>

                    <div class="mb-4">
                        <div class="flex justify-between mb-1">
                            <span class="text-sm text-gray-600">Probabilité</span>
                            <span class="text-sm font-bold ${c.text}">${pct}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3">
                            <div class="${c.bar} h-3 rounded-full transition-all duration-500"
                                 style="width:${pct}%"></div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mb-3">
                        <span class="${c.badge} text-white text-xs px-2 py-1 rounded-full">
                            ${escape(r.confiance)}
                        </span>
                        <span class="text-sm text-gray-600">confiance</span>
                    </div>

                    <div class="bg-gray-50 rounded-lg p-3">
                        <p class="text-sm text-gray-700">${escape(r.message)}</p>
                    </div>

                </div>`;

            // ← Lab 5 : explication LLM chargée après le HTML
            demanderExplication(r);
        }

        // ─────────────────────────────────────────
        // EXPLICATION LLM — Lab 5
        // ─────────────────────────────────────────

        async function demanderExplication(diagnostic_data) {

            const explainData = {
                diagnostic  : diagnostic_data.diagnostic,
                probabilite : diagnostic_data.probabilite,
                age         : parseInt(document.getElementById("age").value),
                sexe        : document.getElementById("sexe").value,
                temperature : parseFloat(document.getElementById("temperature").value),
                region      : document.getElementById("region").value
            };

            const container = document.querySelector("#result-section .bg-white");
            if (!container) return;

            const explDiv = document.createElement("div");
            explDiv.id = "explication-zone";
            explDiv.innerHTML = `
                <div class="mt-4 bg-purple-50 rounded-lg p-4 border border-purple-200">
                    <p class="text-sm text-purple-600 font-medium mb-2">💬 Explication (Llama 3)</p>
                    <p class="text-gray-500 text-sm animate-pulse">Génération en cours...</p>
                </div>`;
            container.appendChild(explDiv);

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 15000);

            try {
                const response = await fetch(API_URL + "/explain", {
                    method  : "POST",
                    headers : { "Content-Type": "application/json" },
                    body    : JSON.stringify(explainData),
                    signal  : controller.signal
                });

                clearTimeout(timer);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const result = await response.json();
                const texte  = String(result.explication)
                    .replace(/&/g,"&amp;")
                    .replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;");

                explDiv.innerHTML = `
                    <div class="mt-4 bg-purple-50 rounded-lg p-4 border border-purple-200">
                        <p class="text-sm text-purple-600 font-medium mb-2">💬 Explication (Llama 3)</p>
                        <p class="text-gray-700 text-sm leading-relaxed">${texte}</p>
                    </div>`;

            } catch (error) {
                clearTimeout(timer);
                const msg = error.name === "AbortError"
                    ? "Délai dépassé (15 s). Réessayez."
                    : "Explication non disponible.";
                explDiv.innerHTML = `
                    <div class="mt-4 bg-gray-50 rounded-lg p-3 border border-gray-200">
                        <p class="text-gray-400 text-sm">⚠️ ${msg}</p>
                    </div>`;
            }
        }

        // ─────────────────────────────────────────
        // AFFICHAGE — ERREUR
        // ─────────────────────────────────────────

        function afficherErreur(msg) {
            document.getElementById("result-section").innerHTML = `
                <div class="bg-red-50 border border-red-200 rounded-xl p-6">
                    <p class="text-red-700 font-medium">${msg}</p>
                    <p class="text-red-500 text-sm mt-2">Vérifiez votre connexion et réessayez.</p>
                </div>`;
        }

    </script>
</body>
</html>
